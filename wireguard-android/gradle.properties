wireguardVersionCode=532
wireguardVersionName=1.9.2
wireguardPackageName=com.portway.vpn

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false
portwayImportScheme=portway
# Baked-in default management-panel URL (Settings can override; the panel can move it
# remotely via the panel_url field in /api/peer/info responses).
# Portway: the management panel URL, baked into BuildConfig.PANEL_URL. Intentionally empty in
# the repository — set it per machine in ~/.gradle/gradle.properties (which Gradle reads ahead
# of this file) or pass -PportwayPanelUrl=... . release.sh refuses to stage a build without it.
portwayPanelUrl=

# Portway: DNS server pinned when a full-tunnel config names none of its own, closing the
# window in Android's still-open getaddrinfo DNS-leak bug (Google issue 337961996).
# Set empty to disable the behaviour entirely.
portwayFallbackDns=1.1.1.1
